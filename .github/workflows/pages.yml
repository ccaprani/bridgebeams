name: Publish Sphinx site

on:
  push:
    branches: [ukie-beams]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package and documentation dependencies
        run: python -m pip install -e '.[docs]'
      - name: Build Sphinx site and coverage map
        run: |
          python tools/build_local_docs.py
          touch docs/_build/html/.nojekyll
          test -f docs/_build/html/coverage.html
          test -f docs/_build/html/_static/coverage/index.html
          test -f docs/_build/html/_static/coverage/coverage-data.json
          test ! -e docs/_build/html/dims_review.html
          test ! -e docs/_build/html/sources
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_build/html
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
