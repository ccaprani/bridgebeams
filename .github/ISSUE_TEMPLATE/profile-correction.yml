name: Profile correction
description: Report a wrong dimension, status, source or attribution for a bridge-beam profile.
title: "[correction] <Class>(\"<size>\"): <short description>"
labels: ["correction"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. bridgebeams is a best-effort, crowd-corrected catalogue; source evidence is what lets us fix it.
  - type: input
    id: profile
    attributes:
      label: Class and size
      placeholder: 'e.g. CivilconMBeamSection("M6") or bridgebeams.us.WsdotTubGirderSection("U54G6")'
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What is wrong?
      options:
        - A dimension or outline detail
        - Section properties (area, centroid, inertia)
        - Source status (e.g. superseded, draft, withdrawn)
        - Source attribution, link or edition
        - Country / jurisdiction assignment
        - Missing profile or family
        - Other
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Current value, correct value, and where on the section.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Source evidence
      description: Title, edition/date, URL, page or drawing number. Published A / centroid / I if available.
    validations:
      required: true
  - type: input
    id: affiliation
    attributes:
      label: Your role (optional)
      placeholder: e.g. designer, producer, agency, researcher
